name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/BlobFlags.Client/package-lock.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore blobflags.slnx

      - name: Build
        run: dotnet build blobflags.slnx --no-restore

      - name: Test
        run: dotnet test tests/BlobFlags.Tests --no-build

      - name: Build client
        working-directory: src/BlobFlags.Client
        run: |
          npm ci
          npm run build
