name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify no banned scripts (.sh / .ps1)
        uses: ls-lint/action@a87c5eb4fb26d7af1bd0adba203dd1e76f7e94eb # v2.3.2

      - name: Setup .NET
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/BlobFlags.Client/package-lock.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore blobflags.slnx

      - name: Build
        run: dotnet build blobflags.slnx --no-restore

      - name: Test
        run: dotnet test tests/BlobFlags.Tests --no-build

      - name: Build client
        working-directory: src/BlobFlags.Client
        run: |
          npm ci
          npm run build
